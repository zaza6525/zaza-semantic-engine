<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAZA Semantic Engine</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3a;
    --ink: #e4e4ec;
    --muted: #8888a0;
    --accent: #6c63ff;
    --accent-hover: #7b73ff;
    --danger: #ff4d6a;
    --success: #4ddb8a;
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: "SF Mono", "Fira Code", "Cascadia Code", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    min-height: 100vh;
  }

  /* Layout */
  .app {
    max-width: 960px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header .badge {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
    font-family: var(--mono);
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .tab {
    padding: 0.6rem 1.2rem;
    font-size: 0.85rem;
    color: var(--muted);
    cursor: pointer;
    border: none;
    background: none;
    font-family: var(--font);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s;
  }

  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .panel { display: none; }
  .panel.active { display: block; }

  /* Drop Zone */
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }

  .dropzone:hover, .dropzone.dragover {
    border-color: var(--accent);
    background: rgba(108, 99, 255, 0.05);
  }

  .dropzone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .dropzone .icon {
    font-size: 2rem;
    margin-bottom: 0.75rem;
    color: var(--muted);
  }

  .dropzone .label {
    color: var(--muted);
    font-size: 0.9rem;
  }

  .dropzone .label strong {
    color: var(--accent);
  }

  /* Upload status */
  .upload-list {
    margin-top: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .upload-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.6rem 0.75rem;
    background: var(--surface);
    border-radius: var(--radius);
    font-size: 0.85rem;
    border: 1px solid var(--border);
  }

  .upload-item .status {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .upload-item .status.ok { background: var(--success); }
  .upload-item .status.err { background: var(--danger); }
  .upload-item .name { flex: 1; }
  .upload-item .meta { color: var(--muted); font-size: 0.8rem; }

  /* Search */
  .search-box {
    position: relative;
    margin-bottom: 1rem;
  }

  .search-box input {
    width: 100%;
    padding: 0.75rem 1rem 0.75rem 2.75rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--ink);
    font-size: 0.95rem;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s;
  }

  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--muted); }

  .search-box .search-icon {
    position: absolute;
    left: 0.85rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 0.9rem;
    pointer-events: none;
  }

  .search-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .search-row input { flex: 1; }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.6rem 1.1rem;
    font-size: 0.85rem;
    font-family: var(--font);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }

  .btn:hover { background: var(--surface2); border-color: var(--muted); }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn.primary:hover { background: var(--accent-hover); }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Results */
  .results {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .result-card {
    padding: 0.85rem 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.85rem;
  }

  .result-card .title {
    font-weight: 500;
    margin-bottom: 0.25rem;
  }

  .result-card .score {
    color: var(--accent);
    font-family: var(--mono);
    font-size: 0.75rem;
  }

  .result-card .preview {
    color: var(--muted);
    margin-top: 0.35rem;
    font-size: 0.8rem;
    line-height: 1.5;
  }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .stat-card {
    padding: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-align: center;
  }

  .stat-card .value {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--ink);
    font-family: var(--mono);
  }

  .stat-card .label {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.25rem;
  }

  .doc-list {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .doc-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.6rem 0.75rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.85rem;
  }

  .doc-item .type {
    font-family: var(--mono);
    font-size: 0.7rem;
    padding: 2px 6px;
    background: var(--surface2);
    color: var(--muted);
    border-radius: 4px;
    text-transform: uppercase;
  }

  .doc-item .name { flex: 1; }
  .doc-item .words { color: var(--muted); font-size: 0.8rem; }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .empty .icon { font-size: 2rem; margin-bottom: 0.75rem; }

  /* Loading */
  .loading {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    padding: 0.75rem 1.25rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.85rem;
    color: var(--ink);
    transform: translateY(120%);
    transition: transform 0.3s ease;
    z-index: 100;
  }

  .toast.show { transform: translateY(0); }
  .toast.error { border-color: var(--danger); }
  .toast.success { border-color: var(--success); }

  /* Responsive */
  @media (max-width: 600px) {
    .app { padding: 1rem; }
    header h1 { font-size: 1.25rem; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>ZAZA Semantic Engine</h1>
    <span class="badge" id="version">v3.1.0</span>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="ingest">Ingestion</button>
    <button class="tab" data-tab="search">Recherche</button>
    <button class="tab" data-tab="documents">Documents</button>
    <button class="tab" data-tab="stats">Statistiques</button>
  </div>

  <!-- INGEST PANEL -->
  <div class="panel active" id="panel-ingest">
    <div class="dropzone" id="dropzone">
      <input type="file" multiple id="file-input">
      <div class="icon">📁</div>
      <div class="label">Glissez des fichiers ici ou <strong>cliquez pour sélectionner</strong></div>
      <div class="label" style="margin-top:0.5rem;font-size:0.75rem">TXT, MD, PDF, DOCX, CSV — Multi-formats</div>
    </div>
    <div class="upload-list" id="upload-list"></div>
  </div>

  <!-- SEARCH PANEL -->
  <div class="panel" id="panel-search">
    <div class="search-row">
      <div class="search-box" style="flex:1">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Rechercher un document ou requête sémantique..." autocomplete="off">
      </div>
      <button class="btn primary" id="search-btn">Chercher</button>
    </div>
    <div id="search-results" class="results"></div>
  </div>

  <!-- DOCUMENTS PANEL -->
  <div class="panel" id="panel-documents">
    <div class="search-box">
      <span class="search-icon">📄</span>
      <input type="text" id="doc-filter" placeholder="Filtrer par nom de fichier...">
    </div>
    <div id="doc-list" class="doc-list"></div>
  </div>

  <!-- STATS PANEL -->
  <div class="panel" id="panel-stats">
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><div class="value">—</div><div class="label">Documents</div></div>
      <div class="stat-card"><div class="value">—</div><div class="label">Mots totaux</div></div>
      <div class="stat-card"><div class="value">—</div><div class="label">Caractères</div></div>
      <div class="stat-card"><div class="value">—</div><div class="label">Densité lex.</div></div>
    </div>
    <div id="embeddings-status" class="result-card" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'stats') loadStats();
    if (tab.dataset.tab === 'documents') loadDocs();
    if (tab.dataset.tab === 'search') document.getElementById('search-input').focus();
  });
});

// Toast
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + type;
  setTimeout(() => el.classList.add('show'), 10);
  setTimeout(() => el.classList.remove('show'), 3000);
}

// Upload
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file-input');
const uploadList = document.getElementById('upload-list');

['dragenter', 'dragover'].forEach(evt => {
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('dragover'); });
});
['dragleave', 'drop'].forEach(evt => {
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('dragover'); });
});

dropzone.addEventListener('drop', e => {
  const files = e.dataTransfer.files;
  if (files.length) handleFiles(files);
});

fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFiles(fileInput.files);
  fileInput.value = '';
});

async function handleFiles(files) {
  for (const file of files) {
    const id = 'up-' + Math.random().toString(36).slice(2, 8);
    const item = document.createElement('div');
    item.className = 'upload-item';
    item.id = id;
    item.innerHTML = `
      <span class="status"></span>
      <span class="name">${file.name}</span>
      <span class="meta">En cours...</span>
    `;
    uploadList.appendChild(item);

    try {
      const formData = new FormData();
      formData.append('file', file);
      const resp = await fetch(API + '/ingest/file', { method: 'POST', body: formData });
      if (!resp.ok) throw new Error(await resp.text());
      const result = await resp.json();
      const statusEl = item.querySelector('.status');
      statusEl.className = 'status ok';
      const metaEl = item.querySelector('.meta');
      metaEl.textContent = result.word_count + ' mots';
    } catch (err) {
      const statusEl = item.querySelector('.status');
      statusEl.className = 'status err';
      const metaEl = item.querySelector('.meta');
      metaEl.textContent = err.message;
    }
  }
}

// Search
const searchInput = document.getElementById('search-input');
const searchBtn = document.getElementById('search-btn');
const searchResults = document.getElementById('search-results');

async function doSearch(query, semantic = true) {
  if (!query) return;
  searchResults.innerHTML = '<div class="result-card"><span class="loading"></span> Recherche...</div>';
  try {
    const url = semantic
      ? `/search-semantic?query=${encodeURIComponent(query)}&top=10`
      : `/search?query=${encodeURIComponent(query)}`;
    const resp = await fetch(API + url);
    if (!resp.ok) throw new Error('Recherche échouée');
    const results = await resp.json();
    if (!results.length) {
      searchResults.innerHTML = '<div class="empty"><div class="icon">🔍</div>Aucun résultat</div>';
      return;
    }
    searchResults.innerHTML = results.map(r => {
      const score = r.score !== undefined ? ` <span class="score">${r.score.toFixed(3)}</span>` : '';
      const preview = r.preview || r.document || '';
      return `
        <div class="result-card">
          <div class="title">${r.filename || r.document || 'Document'}${score}</div>
          ${preview ? `<div class="preview">${escapeHtml(preview.substring(0, 300))}</div>` : ''}
        </div>
      `;
    }).join('');
  } catch (err) {
    searchResults.innerHTML = `<div class="result-card" style="border-color:var(--danger)">${err.message}</div>`;
  }
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

searchBtn.addEventListener('click', () => {
  const q = searchInput.value.trim();
  if (q) doSearch(q, true);
});

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const q = searchInput.value.trim();
    if (q) doSearch(q, true);
  }
});

// Documents
let allDocs = [];
async function loadDocs() {
  const list = document.getElementById('doc-list');
  list.innerHTML = '<div class="empty"><span class="loading"></span></div>';
  try {
    const resp = await fetch(API + '/documents');
    if (!resp.ok) throw new Error('Chargement échoué');
    allDocs = await resp.json();
    renderDocs(allDocs);
  } catch (err) {
    list.innerHTML = `<div class="result-card" style="border-color:var(--danger)">${err.message}</div>`;
  }
}

function renderDocs(docs) {
  const list = document.getElementById('doc-list');
  if (!docs.length) {
    list.innerHTML = '<div class="empty"><div class="icon">📄</div>Aucun document ingéré</div>';
    return;
  }
  list.innerHTML = docs.map(d => `
    <div class="doc-item">
      <span class="type">${d.filetype || '?'}</span>
      <span class="name">${d.filename || d.name || 'Document'}</span>
      <span class="words">${d.word_count || d.words || '—'} mots</span>
    </div>
  `).join('');
}

document.getElementById('doc-filter').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  renderDocs(q ? allDocs.filter(d => (d.filename || '').toLowerCase().includes(q)) : allDocs);
});

// Stats
async function loadStats() {
  try {
    const [summary, embed] = await Promise.all([
      fetch(API + '/summary').then(r => r.json()),
      fetch(API + '/embeddings/status').then(r => r.json()).catch(() => ({}))
    ]);
    const cards = document.querySelectorAll('.stat-card');
    if (summary) {
      cards[0].querySelector('.value').textContent = summary.total_documents || 0;
      cards[1].querySelector('.value').textContent = summary.total_words ? summary.total_words.toLocaleString('fr') : 0;
      cards[2].querySelector('.value').textContent = summary.total_characters ? summary.total_characters.toLocaleString('fr') : 0;
      cards[3].querySelector('.value').textContent = (summary.average_lexical_density || 0).toFixed(1) + '%';
    }
    const statusEl = document.getElementById('embeddings-status');
    if (embed.enabled) {
      statusEl.style.display = 'block';
      statusEl.innerHTML = `<div class="score">✅ Embeddings: ${embed.model} — ${embed.documents_count} documents indexés</div>`;
    } else {
      statusEl.style.display = 'block';
      statusEl.innerHTML = `<div style="color:var(--muted)">⚠️ Embeddings non activés (installez le package avec [semantic])</div>`;
    }
  } catch (err) {
    const grid = document.getElementById('stats-grid');
    grid.innerHTML = `<div class="result-card" style="grid-column:1/-1;border-color:var(--danger)">Erreur chargement: ${err.message}</div>`;
  }
}

// Health check
fetch(API + '/health')
  .then(r => r.json())
  .then(data => {
    document.getElementById('version').textContent = 'v' + (data.version || '3.1.0');
  })
  .catch(() => {});
</script>
</body>
</html>
