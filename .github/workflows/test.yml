name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,semantic,dev]"

      - name: Check CLI
        run: |
          zaza --help
          zaza ingest --help

      - name: Run tests
        run: |
          pytest -v --tb=short

      - name: Smoke test
        run: |
          mkdir -p /tmp/zaza-test-docs
          echo "This is a test document about artificial intelligence and machine learning" > /tmp/zaza-test-docs/test.txt
          zaza ingest /tmp/zaza-test-docs
          zaza stats --json
