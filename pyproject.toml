[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zaza-semantic-engine"
version = "3.0.2"
description = "Local-first multi-format document ingestion engine with semantic search using sentence-transformers and ChromaDB"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "zaza6525"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "chardet>=5.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
api = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "python-multipart>=0.0.6",
    "pydantic>=2.0",
]
semantic = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "ebooklib>=0.18",
]
all = [
    "zaza-semantic-engine[api,semantic]",
]

[project.urls]
Homepage = "https://github.com/zaza6525/zaza-semantic-engine"
Repository = "https://github.com/zaza6525/zaza-semantic-engine"

[project.scripts]
zaza = "zaza.cli:main"
zaza-search-docs = "zaza.search_docs:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
