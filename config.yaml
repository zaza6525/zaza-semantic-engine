# ZAZA Semantic Engine v2 - Configuration

database:
  path: "./data/zaza.db"

ingestion:
  data_dir: "./data"
  extensions:
    - ".txt"
    - ".pdf"
    - ".csv"
    - ".md"
    - ".html"
    - ".xml"
    - ".docx"
  encoding: "utf-8"
  fallback_encoding: "latin-1"

analysis:
  top_words: 20
  min_word_length: 3
  stop_words_language: "fr"  # "fr" or "en"

output:
  dir: "./output"
  formats:
    - "json"
    - "csv"

api:
  enabled: false
  host: "127.0.0.1"
  port: 8000

semantic:
  enabled: true
  model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  embed_dir: "./data/embeddings"
  max_search_results: 10
  max_chunk_size: 512
  overlap: 64
